name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v7
      - name: Build the Astro site
        uses: withastro/action@v6
        env:
          PUBLIC_DEVIS_ENDPOINT: ${{ vars.PUBLIC_DEVIS_ENDPOINT }}
          PUBLIC_DEVIS_PHOTOS_ENABLED: ${{ vars.PUBLIC_DEVIS_PHOTOS_ENABLED }}
        with:
          package-manager: npm


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
