# Deploiement GitLab Pages (apercu en ligne). Le site est aussi deployable sur Vercel.
image: node:20

stages:
  - build

pages:
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
