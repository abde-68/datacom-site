  </g>
  <!-- Texte -->
  <text x="82" y="38" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0B1F3A">DATA<tspan fill="#0A4FFF">COM</tspan></text>
  <text x="83" y="56" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.2" fill="#0A4FFF">ÉLECTRICITÉ &amp; FIBRE OPTIQUE</text>
