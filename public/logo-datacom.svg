<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 72" role="img" aria-label="DATACOM - électricité et fibre optique">
  <!-- Logo PROVISOIRE DATACOM - a valider / remplacer par le logo definitif -->
  <defs>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A4FFF"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <!-- Picto: cercle fibre + eclair -->
  <g>
    <circle cx="36" cy="36" r="30" fill="url(#fiber)"/>
    <path d="M40 16 L24 40 h12 l-4 18 20-26 h-12 z" fill="#FFD100"/>
